<!DOCTYPE html>
<html>

<head>
	<link rel="stylesheet" href="https://unpkg.com/@xterm/xterm/css/xterm.css" />
</head>

<body>
	<div id="terminal"></div>
	<script src="https://unpkg.com/@xterm/xterm/lib/xterm.js"></script>
	<script src="https://unpkg.com/xterm-pty/index.js"></script>
	<!-- Copy wasm_exec.js from your Go installation:
	     cp "$(go env GOROOT)/lib/wasm/wasm_exec.js" . -->
	<script src="wasm_exec.js"></script>
	<script>
		const xterm = new Terminal();
		xterm.open(document.getElementById("terminal"));

		// Create master/slave objects
		const { master, slave } = openpty();

		// Connect the master object to xterm.js
		xterm.loadAddon(master);

		// Buffer holding bytes received from the slave that Go has not yet read
		let stdinBuffer = [];
		// Queue of pending Go fs.read() calls waiting for stdin data.
		// More than one goroutine may simultaneously block on a read, so a queue
		// is needed to avoid silently dropping earlier requests.
		const stdinWaiters = [];

		// Satisfy as many queued waiters as possible from stdinBuffer, then store
		// any leftover bytes back in stdinBuffer.
		function drainStdinWaiters() {
			while (stdinWaiters.length > 0 && stdinBuffer.length > 0) {
				const { buffer, offset, length, callback } = stdinWaiters.shift();
				const n = Math.min(stdinBuffer.length, length);
				const data = stdinBuffer.splice(0, n);
				for (let i = 0; i < n; i++) buffer[offset + i] = data[i];
				callback(null, n);
			}
		}

		// Drain slave readable data into stdinBuffer and satisfy any waiters.
		slave.onReadable(() => {
			const data = slave.read();
			if (data.length === 0) return;
			stdinBuffer.push(...data);
			drainStdinWaiters();
		});

		// Route Go stdout/stderr (fd 1 and fd 2) to the xterm-pty slave.
		// wasm_exec.js sets up globalThis.fs; we patch it before running Go.
		// go's fs.write() calls this.writeSync(), so patching writeSync is enough.
		const origWriteSync = globalThis.fs.writeSync.bind(globalThis.fs);
		globalThis.fs.writeSync = function(fd, buf) {
			if (fd === 1 || fd === 2) {
				slave.write(Array.from(buf));
				return buf.length;
			}
			return origWriteSync(fd, buf);
		};

		// Route Go stdin (fd 0) reads to the xterm-pty slave.
		// The default wasm_exec.js returns ENOSYS for all reads; replace it.
		const origRead = globalThis.fs.read.bind(globalThis.fs);
		globalThis.fs.read = function(fd, buffer, offset, length, position, callback) {
			if (fd === 0) {
				stdinWaiters.push({ buffer, offset, length, callback });
				drainStdinWaiters();
				return;
			}
			origRead(fd, buffer, offset, length, position, callback);
		};

		// Load and run the Go wasm binary
		const go = new Go();
		WebAssembly.instantiateStreaming(fetch("main.wasm"), go.importObject).then(result => {
			go.run(result.instance);
		});
	</script>
</body>

</html>
